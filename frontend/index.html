<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BlockTrack — privacy-preserving parcel tracking. Encrypted in your browser, verifiable on-chain."
    />
    <meta name="theme-color" content="#f4f6f8" />
    <title>BlockTrack</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bt.theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      BlockTrack needs JavaScript to decrypt shipment details locally. Enable
      JavaScript and reload.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
